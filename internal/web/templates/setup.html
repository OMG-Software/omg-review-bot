{{define "content"}}
<div class="narrow card">
  <img class="logo" src="/static/icon.svg" alt="" width="96" height="96">
  <h1>Welcome to OMG Review Bot</h1>
  <p>Choose an admin password for this web UI. It protects your GitHub App key and model settings.</p>
  <form method="post" action="/setup" class="stack">
    <label>Password <input type="password" name="password" minlength="10" required autofocus autocomplete="new-password"></label>
    <label>Confirm password <input type="password" name="confirm" minlength="10" required autocomplete="new-password"></label>
    <button class="primary">Set password</button>
  </form>
</div>
{{end}}
