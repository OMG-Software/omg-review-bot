# nfpm config for the deb, rpm and Arch packages. packaging/build-packages.sh
# sets the PKG_* variables, replaces @PRBOT_BINARY@ and @CA_PACKAGE@ (nfpm
# doesn't expand variables in src paths or depends) and runs nfpm from the repository root, which the
# other src paths are relative to.
name: prbot
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
section: net
priority: optional
maintainer: OMG Software
vendor: OMG Software
homepage: https://github.com/OMG-Software/omg-review-bot
license: Apache-2.0
description: |-
  Self-hosted pull request review bot driven by an LLM.
  prbot reviews GitHub pull requests with a local or hosted model (LM Studio,
  Ollama or Ollama Cloud), following a review skill, and is managed through a
  small web UI. It runs as the prbot systemd service and keeps its data in
  /var/lib/prbot.

# The static binary needs no libraries, only the system's CA bundle to verify
# GitHub's and the model host's TLS certificates.
depends:
  - "@CA_PACKAGE@"

contents:
  - src: "@PRBOT_BINARY@"
    dst: /usr/bin/prbot
    file_info:
      mode: 0755
  - src: packaging/prbot.service
    dst: /usr/lib/systemd/system/prbot.service
    file_info:
      mode: 0644
  - src: packaging/sysusers.conf
    dst: /usr/lib/sysusers.d/prbot.conf
    file_info:
      mode: 0644
  - src: packaging/prbot.env
    dst: /etc/prbot/prbot.env
    type: config|noreplace
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/prbot/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/prbot/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

archlinux:
  scripts:
    # pacman runs post_upgrade, not post_install, on an upgrade.
    postupgrade: packaging/scripts/postinstall.sh
